name: Misfits Market (fka Imperfect Foods)
description: 'Misfits Market is an online grocery delivery service that rescues surplus
  and cosmetically imperfect produce, plus organic vegetables, dairy, meat, seafood,
  pantry staples, and wine, delivering sustainable groceries across the United States
  to help reduce food waste. It merged with Imperfect Foods in 2022, and both brands
  now operate under Misfits Market. The company has no public developer API program:
  its digital surface is a consumer e-commerce website, a customer help center, and
  iOS/Android mobile apps. It publishes a machine-readable llms.txt for AI agents.'
